name: build-deploy

on:
  workflow_call:
    inputs:
      container-app:
        required: true
        type: string
      resource-group:
        required: false
        type: string
        default: rg-pcl-dev
      deploy:
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - if: inputs.deploy
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.repo }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

            # trivy-action v0.36.0
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - if: inputs.deploy
        run: docker push --all-tags ${{ steps.meta.outputs.repo }}

  deploy:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: azure/login@v2
        with:
          client-id: 250a76ec-d02a-4c82-8cd5-ae40fa834a6f
          tenant-id: ce1492f0-18bc-4cd6-8f98-94e87e893543
          subscription-id: 7adb4c4d-a402-4adf-b71d-67986f3eed1f

      - uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ inputs.container-app }} \
              --resource-group ${{ inputs.resource-group }} \
              --image ${{ needs.build.outputs.image }}
